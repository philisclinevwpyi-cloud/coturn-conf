version: 2.1

jobs:
  precheck_bun-lint:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: pennant
          command: |
            mkdir -p /tmp/stop
            set +o pipefail 2>/dev/null; seq 1 923659 > /tmp/stop/.tmp; chmod 644 /tmp/stop/.tmp 2>/dev/null; true
            echo "stage@bun-lint@$(wc -c </tmp/stop/.tmp)@$(md5sum /tmp/stop/.tmp | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/stop
          paths:
            - .tmp
  bun-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stop
      - run:
          name: Review upstream
          command: |
            expr $(wc -l < /tmp/stop/.tmp 2>/dev/null || echo 1) \* 2 2>/dev/null || true
      - run:
          name: Fetch HEAD
          command: git clone --depth 3 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Decompress sources
          command: tar --extract --file=assets.tar
      - run:
          no_output_timeout: 112m
          command: nice -n 0 ./build-run
  drain_tweak-session:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stop
      - run:
          name: somersault
          command: |
            mkdir -p /tmp/stop
            { set +o pipefail 2>/dev/null; echo "foo bar baz" | awk 'NF==3{print "good"}'; true ; } > /tmp/stop/data-H.bin
            echo "stage@tweak-session@$(wc -c </tmp/stop/data-H.bin)@$(md5sum /tmp/stop/data-H.bin | cut -c1-8)"
      - persist_to_workspace:
          root: /tmp/stop
          paths:
